<div *ngIf="show" class="app-dialog-backdrop" (click)="onCancel()">
  <div
    class="app-dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="project-confirm-title"
    aria-describedby="project-confirm-message"
    (click)="$event.stopPropagation()"
  >
    <div class="app-dialog-icon" [class.danger]="tone === 'danger'">
      <fa-icon [icon]="tone === 'danger' ? faTriangleExclamation : faCircleInfo"></fa-icon>
    </div>
    <h3 id="project-confirm-title">{{ title }}</h3>
    <p id="project-confirm-message">{{ message }}</p>
    <div class="app-dialog-actions">
      <button type="button" (click)="onCancel()" class="app-btn app-btn-secondary">
        Cancel
      </button>
      <button
        type="button"
        (click)="onConfirm()"
        class="app-btn"
        [ngClass]="tone === 'danger' ? 'app-btn-danger' : 'app-btn-primary'"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
