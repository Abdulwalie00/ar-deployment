<div class="app-dialog-backdrop" (click)="closeDialog()">
  <div
    class="app-dialog align-left"
    role="dialog"
    aria-modal="true"
    aria-labelledby="verify-title"
    aria-describedby="verify-description"
    (click)="$event.stopPropagation()"
  >
    <h3 id="verify-title">Confirm it's you</h3>
    <p id="verify-description">
      For security, enter your password to continue.
    </p>

    <form (ngSubmit)="verifyPassword()" class="grid gap-2 mt-2">
      <label for="verify-password" class="sr-only">Password</label>
      <input
        #passwordInput
        type="password"
        id="verify-password"
        [(ngModel)]="password"
        name="password"
        class="app-input"
        [class.is-invalid]="errorMessage"
        placeholder="Your password"
        autocomplete="current-password"
        required
      />

      <p *ngIf="errorMessage" class="app-field-error" role="alert">
        {{ errorMessage }}
      </p>

      <div class="app-dialog-actions">
        <button type="button" (click)="closeDialog()" class="app-btn app-btn-secondary">
          Cancel
        </button>
        <button type="submit" [disabled]="isLoading || !password" class="app-btn app-btn-primary">
          <span *ngIf="isLoading" class="app-spinner" aria-hidden="true"></span>
          {{ isLoading ? 'Checking…' : 'Continue' }}
        </button>
      </div>
    </form>
  </div>
</div>
