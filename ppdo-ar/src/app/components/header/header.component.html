<header class="header-shell app-glass">
  <div class="header-grid">
    <a routerLink="/project-dashboard" class="brand-link">
      <div class="brand-mark">PMR</div>
      <div class="brand-copy">
        <p class="brand-kicker">Integrated Monitoring Workspace</p>
        <h1>Project Management Report</h1>
      </div>
    </a>

    <div class="header-actions">
      <div class="icto-tag">
        <img src="app/assets/logos/ICTO.png" alt="ICTO Logo" class="h-6 w-auto" />
        <span>Powered by ICTO</span>
      </div>

      <span class="app-chip time-chip">{{ currentTime }}</span>

      <button (click)="toggleDarkMode()" class="app-icon-btn" title="Toggle Theme">
        <fa-icon [icon]="isDarkMode ? faSun : faMoon"></fa-icon>
      </button>

      <div class="relative">
        <button (click)="toggleNotificationMenu()" class="app-icon-btn" title="Notifications">
          <fa-icon [icon]="faBell"></fa-icon>
          <span *ngIf="unreadCount > 0" class="notif-count">{{ unreadCount }}</span>
        </button>

        <div *ngIf="notificationMenuOpen" class="menu-panel notif-panel">
          <div class="menu-head">Notifications</div>

          <div *ngIf="notifications.length > 0; else noNotifications" class="notif-list">
            <a
              *ngFor="let notification of notifications"
              (click)="onNotificationClick(notification)"
              class="notif-item"
            >
              {{ notification.message }}
            </a>
          </div>

          <ng-template #noNotifications>
            <p class="menu-empty">No new notifications.</p>
          </ng-template>

          <a routerLink="/notifications" (click)="toggleNotificationMenu()" class="menu-link">
            View All Notifications
          </a>
        </div>
      </div>

      <div class="relative">
        <button class="user-chip" (click)="toggleMenu()">
          <div
            *ngIf="currentUser"
            class="user-avatar"
            [ngStyle]="{ 'background-color': avatarColor }"
          >
            {{ initials }}
          </div>

          <div class="user-text">
            <span class="user-name">
              {{ currentUser ? currentUser.firstName + ' ' + currentUser.lastName : 'User' }}
            </span>
            <span class="user-sub">Online</span>
          </div>
        </button>

        <div *ngIf="menuOpen" class="menu-panel profile-panel">
          <a routerLink="/profile" class="menu-item" (click)="closeMenu()">Profile</a>
          <button class="menu-item danger" (click)="confirmLogout()">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <app-confirm-dialog
    *ngIf="showDialog"
    [message]="'Are you sure you want to log out?'"
    (confirm)="onConfirm($event)"
  ></app-confirm-dialog>
</header>
