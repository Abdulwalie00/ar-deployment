<div class="app-dialog warning-dialog" role="alertdialog" aria-labelledby="warning-title" aria-describedby="warning-message">
  <div class="app-dialog-icon danger" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
    </svg>
  </div>
  <h3 id="warning-title">{{ data.title }}</h3>
  <p id="warning-message">{{ data.message }}</p>
  <div class="app-dialog-actions">
    <button type="button" (click)="onOkClick()" class="app-btn app-btn-primary" cdkFocusInitial>
      OK, take me back
    </button>
  </div>
</div>
