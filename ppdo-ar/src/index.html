<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PGLDS Project Monitoring</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Project monitoring and reporting workspace for the offices of the Provincial Government of Lanao del Sur.">
  <meta name="application-name" content="PGLDS Project Monitoring">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PGLDS PMR">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" as="image" href="app/assets/logos/LDS.png">
  <meta name="theme-color" content="#eef4f1">
  <script>
    (function () {
      var root = document.documentElement;
      // Apply the saved dark mode before anything paints to avoid a white flash.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          root.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1514');
        }
      } catch (e) {}

      var installed = window.matchMedia(
        '(display-mode: standalone), (display-mode: window-controls-overlay), (display-mode: minimal-ui)'
      ).matches || navigator.standalone === true;
      root.classList.add(installed ? 'is-installed-app' : 'is-browser-tab');

      // Keep the install prompt if it fires before Angular is ready.
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__installPrompt = event;
      });

      // Called by the app once the first page is on screen. The installed app
      // lets the intro animation finish; a browser tab gets out of the way fast.
      var minimumMs = installed ? 1700 : 450;
      window.__hideSplash = function () {
        var splash = document.getElementById('app-splash');
        if (!splash || splash.getAttribute('data-leaving')) return;
        splash.setAttribute('data-leaving', 'true');
        setTimeout(function () {
          splash.classList.add('splash-leave');
          root.classList.add('app-entering');
          setTimeout(function () {
            splash.remove();
            root.classList.remove('app-entering');
          }, 700);
        }, Math.max(0, minimumMs - performance.now()));
      };
      // Safety net: never leave the splash up if something goes wrong.
      setTimeout(window.__hideSplash, 15000);
    })();
  </script>
  <style>
    #app-splash {
      --splash-bg: #eef4f1;
      --splash-bg-2: #e2ece7;
      --splash-text: #1f2d2a;
      --splash-muted: #5f7470;
      --splash-primary: #136f63;
      --splash-accent: #f18f01;
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.6rem;
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
      color: var(--splash-text);
      background:
        radial-gradient(circle at 15% 10%, rgba(19, 111, 99, 0.18), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(241, 143, 1, 0.16), transparent 45%),
        linear-gradient(160deg, var(--splash-bg), var(--splash-bg-2));
      transition: opacity 600ms ease, visibility 600ms ease;
    }
    .dark #app-splash {
      --splash-bg: #0f1514;
      --splash-bg-2: #111d1b;
      --splash-text: #e6f2ef;
      --splash-muted: #a8beb9;
      --splash-primary: #1f9d8b;
    }
    .splash-stage {
      position: relative;
      width: 168px;
      height: 168px;
      display: grid;
      place-items: center;
      transition: transform 650ms cubic-bezier(.6, 0, .2, 1), opacity 500ms ease;
    }
    .splash-halo {
      position: absolute;
      inset: -40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(31, 157, 139, 0.35), transparent 65%);
      opacity: 0;
      animation: splashHalo 2.4s ease-in-out 700ms infinite;
    }
    .splash-ring {
      position: absolute;
      inset: -14px;
      width: calc(100% + 28px);
      height: calc(100% + 28px);
      transform: rotate(-90deg);
    }
    .splash-ring circle {
      fill: none;
      stroke: var(--splash-primary);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 615;
      stroke-dashoffset: 615;
      animation: splashDraw 1100ms cubic-bezier(.65, 0, .35, 1) 250ms forwards;
    }
    .splash-ring circle.accent {
      stroke: var(--splash-accent);
      stroke-width: 3;
      stroke-dasharray: 40 575;
      stroke-dashoffset: 0;
      opacity: 0;
      transform-origin: 50% 50%;
      animation: splashOrbit 1.6s linear 1300ms infinite, splashFadeIn 300ms ease 1300ms forwards;
    }
    .splash-tile {
      width: 100%;
      height: 100%;
      border-radius: 38px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 25% 15%, #2bb39f 0%, transparent 55%),
        linear-gradient(145deg, #178a7b 0%, #136f63 45%, #0b4a42 100%);
      box-shadow: 0 24px 48px rgba(11, 74, 66, 0.35);
      opacity: 0;
      transform: scale(.55) rotate(-10deg);
      animation: splashPop 750ms cubic-bezier(.2, .9, .3, 1.35) forwards;
    }
    .splash-seal {
      width: 76%;
      height: 76%;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transform: rotate(-120deg) scale(.7);
      animation: splashSeal 900ms cubic-bezier(.2, .8, .2, 1) 200ms forwards;
    }
    .splash-seal img {
      width: 94%;
      height: 94%;
      object-fit: contain;
    }
    .splash-copy {
      text-align: center;
      transition: transform 600ms ease, opacity 400ms ease;
    }
    .splash-copy h1 {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      opacity: 0;
      animation: splashRise 600ms ease 550ms forwards;
    }
    .splash-copy h1 span {
      color: var(--splash-primary);
    }
    .splash-copy p {
      margin: 0.35rem 0 0;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--splash-muted);
      opacity: 0;
      animation: splashRise 600ms ease 750ms forwards;
    }
    .splash-bar {
      width: 160px;
      height: 4px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(19, 111, 99, 0.15);
      opacity: 0;
      animation: splashFadeIn 400ms ease 1000ms forwards;
    }
    .splash-bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--splash-primary), var(--splash-accent));
      animation: splashSlide 1.1s ease-in-out infinite;
    }
    /* Exit: the emblem zooms toward the viewer while the screen fades away. */
    #app-splash.splash-leave {
      opacity: 0;
      visibility: hidden;
    }
    #app-splash.splash-leave .splash-stage {
      transform: scale(1.35);
      opacity: 0;
    }
    #app-splash.splash-leave .splash-copy {
      transform: translateY(12px);
      opacity: 0;
    }
    /* The app eases in underneath as the splash leaves. */
    .app-entering app-root > :not(app-feedback-host):not(.skip-link) {
      animation: appEnter 650ms cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes appEnter {
      from { opacity: 0; transform: scale(.97); }
      to { opacity: 1; transform: none; }
    }
    @keyframes splashPop {
      to { opacity: 1; transform: none; }
    }
    @keyframes splashSeal {
      to { opacity: 1; transform: none; }
    }
    @keyframes splashDraw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes splashOrbit {
      to { transform: rotate(360deg); }
    }
    @keyframes splashHalo {
      0%, 100% { opacity: 0.25; transform: scale(.9); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes splashRise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes splashFadeIn {
      to { opacity: 1; }
    }
    @keyframes splashSlide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash *, .app-entering app-root > * {
        animation-duration: 1ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-label="Loading PGLDS Project Monitoring">
    <div class="splash-stage" aria-hidden="true">
      <div class="splash-halo"></div>
      <svg class="splash-ring" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="97"></circle>
        <circle class="accent" cx="100" cy="100" r="97"></circle>
      </svg>
      <div class="splash-tile">
        <div class="splash-seal"><img src="app/assets/logos/LDS.png" alt=""></div>
      </div>
    </div>
    <div class="splash-copy">
      <h1>PGLDS <span>Project Monitoring</span></h1>
      <p>Provincial Government of Lanao del Sur</p>
    </div>
    <div class="splash-bar" aria-hidden="true"><span></span></div>
  </div>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
