<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PGLDS Project Monitoring</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Project monitoring and reporting workspace for the offices of the Provincial Government of Lanao del Sur.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#136f63">
  <script>
    // Apply the saved dark mode before Angular loads to avoid a white flash.
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
