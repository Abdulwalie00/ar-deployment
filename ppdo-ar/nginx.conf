# Add this 'map' block at the top of your nginx.conf, inside the 'http' block
# but outside any 'server' blocks. It correctly handles the Connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Do not advertise the nginx version.
    server_tokens off;

    # Basic browser hardening. nginx does not pass add_header down into a location
    # that sets its own headers, so the cache locations below repeat these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # This block routes all API requests to the backend
    location /api/ {
        # ✅ FIX: Use a matching trailing slash to correctly pass the path
        proxy_pass http://backend:8080/api/;
        # ✅ FIX: Set the Host header explicitly for CORS to w
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This block handles WebSocket traffic
    location /ws/ {
        # ✅ FIX: Use a matching trailing slash to correctly pass the path
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # ✅ FIX: Set the Host header explicitly for CORS
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # The service worker, its manifest and the app manifest must always be
    # re-checked, otherwise installed apps may never see a new version.
    location ~* ^/(index\.html|ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # File names of built JS/CSS contain a content hash, so they can be cached for long.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # This block serves the Angular frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
