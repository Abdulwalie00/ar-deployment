# No passwords or keys in this file - it is committed to git.
# Values come from environment variables (docker-compose passes them) or, when
# running locally, from the project's .env file (never committed).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.address=0.0.0.0
server.port=8080

spring.ai.ollama.base-url=http://ollama:11434
spring.ai.ollama.model=tinyllama

# MariaDB database connection settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/${DB_NAME:ppdo_ar_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# Off by default so queries (and the values in them) are not written to logs.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Sign-in tokens. JWT_SECRET must be a long random value (32+ bytes); the app refuses to start without it.
jwt.secret=${JWT_SECRET}
# How long a sign-in lasts before the user must sign in again.
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Budget protection
#   ADMINS_AND_OWN_OFFICE - admins see all offices; regular users see their own office (default)
#   ADMINS_ONLY           - only admins and super admins
#   SUPERADMINS_ONLY      - only super admins
budget.visibility=${BUDGET_VISIBILITY:ADMINS_AND_OWN_OFFICE}
# Minutes a budget stays unlocked after the user re-enters their password.
budget.unlock-minutes=${BUDGET_UNLOCK_MINUTES:10}

# Initial password for accounts created on first start. Leave empty to generate a random one (printed once in the log).
app.bootstrap-password=${APP_BOOTSTRAP_PASSWORD:}

# Directory for storing uploaded files
upload.dir=${UPLOAD_DIR:project-images/}
